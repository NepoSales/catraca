packages:
  - "apps/*"
  - "packages/*"

# Versões compartilhadas: um pacote declara "typescript": "catalog:"
# e recebe a versão definida aqui. Uma única fonte de verdade para o monorepo.
catalog:
  typescript: ~6.0.3
  zod: ^4.6.7
  jest: ^30.5.2
  ts-jest: ^29.4.15
  "@types/jest": ^30.0.0
  "@types/node": ^24.19.2
  mqtt: ^5.16.1
  "@platformatic/kafka": ^2.14.0
  "@nestjs/common": ^12.3.2
  "@nestjs/core": ^12.3.2
  "@nestjs/testing": ^12.3.2
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2

# Dependências autorizadas (true) ou não (false) a rodar scripts na instalação.
# O pnpm bloqueia por padrão, porque um script de instalação roda código arbitrário.
allowBuilds:
  # Vem do Jest (modo watch). Já traz binário pronto; o script só compila um fallback.
  '@parcel/watcher': false
